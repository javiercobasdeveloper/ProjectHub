# La configuración puede sustituirse con variables de entorno al desplegar.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/projecthub}
spring.datasource.username=${DB_USERNAME:projecthub}
spring.datasource.password=${DB_PASSWORD:projecthub}

# Flyway es la autoridad del esquema; Hibernate solo comprueba que el mapeo coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true