# H2 permite ejecutar pruebas de persistencia sin instalar PostgreSQL en el equipo.
spring.datasource.url=jdbc:h2:mem:projecthub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Las pruebas usan la misma migración SQL y validan el mapeo JPA contra ese esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true